# Two jobs on GitHub's hosted runners (no GPU): the full build (CUDA code included) with the tests
# that need no GPU, and a CPU-only build (no CUDA toolkit) with all of its tests. The GPU tests run
# wherever a CUDA device is visible: `ctest --preset release`.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: nvidia/cuda:13.0.2-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build g++ libglfw3-dev libgl-dev
      - name: Configure
        run: cmake --preset ci -G Ninja
      - name: Build
        run: cmake --build --preset ci
      - name: Tests without a GPU
        run: ctest --preset ci-cpu --output-on-failure

  # CPU-only build on a plain runner: no CUDA toolkit, no NVIDIA driver. Builds with
  # SFM_WITH_CUDA=OFF and runs every test that build has, the bunny reconstructions included.
  cpu-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install build tools (no CUDA)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ libglfw3-dev libgl-dev \
            python3-dev python3-numpy
          if command -v nvcc; then echo "nvcc found: this job must run without CUDA"; exit 1; fi
      - name: Configure (preset cpu, with the Python module)
        run: cmake --preset cpu -G Ninja -DSFM_BUILD_PYTHON=ON -DPython_EXECUTABLE=/usr/bin/python3
      - name: Build
        run: cmake --build --preset cpu
      - name: All tests of the CPU build
        run: ctest --preset cpu
