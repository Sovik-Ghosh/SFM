# pip install .            -> the Python module `epipole`, CPU only (no CUDA toolkit needed)
# SFM_WITH_CUDA=ON pip install .   -> with the CUDA stages (CUDA 13 toolkit; GPU arch from CMake)
[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "epipole"
dynamic = ["version"]
description = "Structure-from-Motion in C++17 and CUDA: camera poses and a point cloud from photos"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["numpy"]
authors = [{ name = "Sovik Ghosh" }]
keywords = ["structure from motion", "sfm", "photogrammetry", "3d reconstruction", "cuda", "colmap"]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://sovik-ghosh.github.io/sfm-cuda/"
Source = "https://github.com/Sovik-Ghosh/sfm-cuda"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/python-{wheel_tag}"
wheel.packages = ["python/epipole"]
install.components = ["python"]
sdist.exclude = ["build", "outputs", "data/eth3d", "data/middlebury"]

[tool.scikit-build.cmake.define]
SFM_BUILD_PYTHON = "ON"
SFM_BUILD_TESTS = "OFF"
SFM_BUILD_VIEWER = "OFF"
SFM_WITH_CUDA = { env = "SFM_WITH_CUDA", default = "OFF" }

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'VERSION (?P<value>\d+\.\d+\.\d+)'
